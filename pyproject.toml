[project]
name = "pipeline-alfabetizacao"
version = "0.1.0"
description = "Tech Challenge Fase 2 - Pipeline Hibrido"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyarrow",
    "google-cloud-bigquery",
    "google-cloud-storage",
    "google-cloud-monitoring",
    "google-cloud-pubsub",
    "duckdb",
    "numpy",
    "great_expectations>=1.20,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    # Great Expectations 1.20 avisa sobre `result_format` configurado no Validator em vez do
    # runtime da suite — cosmético (a suite ainda valida corretamente), mas gera dezenas de
    # UserWarning por rodada de testes, poluindo o log de CI. Achado A6 da revisão de aderência.
    "ignore:.*result_format.*:UserWarning",
]
